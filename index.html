<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Biblioteca</h1>

        <input type="search" id="busqueda" placeholder="Busca un libro...">

        <button id="btn-favoritos">♡ Mis favoritos</button>

    </header>


    <nav id="generos">
        <button class="btn-genero" data-genero="todos">Todos</button>
        <button class="btn-genero" data-genero="romance">Romance</button>
        <button class="btn-genero" data-genero="fantasy">Fantasia</button>
        <button class="btn-genero" data-genero="thriller">Misterio</button>
        <button class="btn-genero" data-genero="historic">Histórico</button>
        <button class="btn-genero" data-genero="adventure">Aventura</button>
    </nav>



    <section id="contenedor-libros">
        <!--ACA TIENEN QUE IR LOS LIBROSSSSS-->

        <div id="popup-libro">
            <div class="contenido-popup">
                <button id="cerrar-popup">cerrar</button>

                <img id="popup-portada" src="" alt="">

                <div>
                    <h2 id="popup-titulo"></h2>
                    <p id="popup-autor"></p>
                    <p id="popup-anio"></p>
                    <p id="popup-generos"></p>
                </div>
            </div>
        </div>


    </section>

    <script src="script.js"></script>
</body>

</html>
